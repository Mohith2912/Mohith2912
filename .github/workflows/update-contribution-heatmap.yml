name: Update contribution heatmap

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest contribution heatmap
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 \
            "https://ghchart.xqsit94.in/dark:halloween/Mohith2912" \
            --output assets/contribution-heatmap.svg

      - name: Commit heatmap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-heatmap.svg
          if git diff --staged --quiet; then
            echo "Contribution heatmap is already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub contribution heatmap"
          git push
